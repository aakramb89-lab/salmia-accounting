name: Build Salmia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فك ملف ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: البحث عن مشروع Android
        run: |
          echo "البحث عن gradlew..."

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "لم يتم العثور على مشروع Android داخل ZIP"
            echo "محتويات الملفات:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "تم العثور على المشروع:"
          echo "$PROJECT_DIR"

      - name: تجهيز Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: بناء APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Salmia-Accounting-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
